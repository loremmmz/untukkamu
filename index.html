<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamu masih ingat kann..., Zahra?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg-1: #fbe4ef;
    --bg-2: #e6dcf1;
    --paper: #fffafc;
    --ink: #6d4f72;
    --ink-soft: #866c92;
    --rose: #d56f9c;
    --line: #d9c7e6;
    --track: #efe3f4;
    --pick: #fbe3ee;
    --on-rose: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #2c2238;
      --bg-2: #3a2d4a;
      --paper: #33283f;
      --ink: #f2e3ef;
      --ink-soft: #c7b2d0;
      --rose: #e59bbd;
      --line: #5a4a6b;
      --track: #44365a;
      --pick: #4a3a5c;
      --on-rose: #2c2238;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #2c2238;
    --bg-2: #3a2d4a;
    --paper: #33283f;
    --ink: #f2e3ef;
    --ink-soft: #c7b2d0;
    --rose: #e59bbd;
    --line: #5a4a6b;
    --track: #44365a;
    --pick: #4a3a5c;
    --on-rose: #2c2238;
    color-scheme: dark;
  }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 28px 18px;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.6;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 16px;
    padding: 36px 26px 30px;
    text-align: center;
    box-shadow: 0 1px 0 var(--bg-2), 0 24px 48px -28px rgba(109, 79, 114, 0.45);
  }

  h1 { margin: 0; font-weight: normal; line-height: 1; }
  .hello {
    display: block;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.4;
  }
  .name {
    display: block;
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: clamp(56px, 16vw, 80px);
    line-height: 1.1;
    color: var(--rose);
  }
  .wish { margin: 18px 0 26px; font-size: 21px; }

  .count {
    margin: 18px 0 0;
    font-style: italic;
    font-size: 17px;
    color: var(--ink-soft);
  }
  .progress {
    height: 4px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress span {
    display: block;
    height: 100%;
    background: var(--rose);
    transition: width 0.4s ease;
  }
  .q {
    margin: 14px 0 22px;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.3;
  }

  .opts { display: grid; gap: 10px; text-align: left; }
  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-size: 19px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s, border-color 0.2s;
  }
  .opt:hover, .opt.picked { border-color: var(--rose); background: var(--pick); }
  .letter {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .nav {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .nav.center { justify-content: center; }
  .btn {
    font: inherit;
    font-size: 19px;
    font-weight: 600;
    color: var(--on-rose);
    background: var(--rose);
    border: 0;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
  }
  .ghost {
    font: inherit;
    font-size: 17px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .ghost:disabled { opacity: 0.4; cursor: default; }
  .opt:focus-visible, .btn:focus-visible, .ghost:focus-visible {
    outline: 2px solid var(--rose);
    outline-offset: 2px;
  }

  .score {
    margin-top: 8px;
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: 88px;
    line-height: 1;
    color: var(--rose);
  }
  .score span {
    font-family: inherit;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .key {
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
    text-align: left;
    font-size: 17px;
  }
  .key li {
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }

  .step { animation: fade 0.5s ease-out both; }

  .env-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 64px; }
  .envelope { position: relative; display: block; width: 100%; max-width: 340px; height: 210px; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
  .envelope:disabled { cursor: default; }
  .envelope > span { position: absolute; display: block; }
  .env-body { inset: 0; z-index: 2; background: var(--track); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 30px -18px rgba(109, 79, 114, 0.5); }
  .flap { top: 0; left: 0; width: 100%; height: 50%; z-index: 4; background: var(--line); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; }
  .seal { left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; background: var(--rose); color: var(--on-rose); display: grid; place-items: center; font-size: 26px; line-height: 1; box-shadow: 0 6px 14px -6px rgba(109, 79, 114, 0.6); }
  .from { left: 18px; bottom: 14px; z-index: 3; font-style: italic; font-size: 16px; color: var(--ink-soft); }
  .paper { left: 8%; right: 8%; top: 14px; z-index: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 18px 16px; box-shadow: 0 8px 18px -12px rgba(109, 79, 114, 0.5); }
  .paper.out { z-index: 5; animation: paperOut 1.1s 0.45s ease-out both; }
  .msg { display: block; font-size: 20px; line-height: 1.6; color: var(--ink); text-align: center; }
  .envelope.open .flap { animation: flapOpen 0.7s ease forwards; }
  .envelope.open .seal { animation: sealOut 0.3s ease forwards; }
  .tap { margin: 14px 0 0; font-style: italic; font-size: 18px; color: var(--ink-soft); }
  .reveal { animation: fade 0.6s 1.4s ease-out both; }
  @keyframes flapOpen { from { transform: rotateX(0deg); } to { transform: rotateX(180deg); } }
  @keyframes sealOut { to { opacity: 0; } }
  @keyframes paperOut { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 1; transform: translateY(-45%); } }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <main class="card" id="app"></main>

<script>
  const QUESTIONS = [
    { q: "Kapan pertama kali kita bertemu?", o: ["25 Januari 2026", "27 Januari 2026", "2 Februari 2026", "30 Januari 2026"], a: 1 },
    { q: "Kapan terakhir kali kita bertemu?", o: ["1 Oktober 2026", "31 Oktober 2026", "2 November 2026", "1 November 2026"], a: 3 },
    { q: "Apa momen paling berkesan bagiku?", o: ["Zahra merayakan ulang tahunku", "Lulus ujian bareng", "Lomba cerdas cermat", "Nonton film bersama"], a: 0 },
    { q: "Kapan ulang tahunku?", o: ["10 Mei", "16 Mei", "6 Mei", "6 Juni"], a: 2 },
    { q: "Apa hadiah ulang tahunku?", o: ["Boneka, jam tangan, dan kue cokelat", "Tas, gelang, dan kue Spider-Man", "Buku, headset, dan kue ulang tahun", "Tas, sepatu, dan kue bolu"], a: 1 },
  ];

  const TIERS = [
    [5, "Sempurna! Kamu benar-benar ingat kenangan kita."],
    [4, "Hampir sempurna! Kenangan kita masih tersimpan rapi di ingatanmu."],
    [3, "Lumayan! Ada beberapa momen yang perlu sering-sering kita ulang ya."],
    [1, "Yuk, baca ulang kenangan kita biar makin lengkap lagi."],
    [0, "Sepertinya kita harus bikin lebih banyak kenangan baru, biar makin banyak yang diingat."]
  ];

  let state = "start";
  let current = 0;
  let answers = [];
  let showKey = false;
  let opened = false;

  function score() {
    return answers.reduce((n, v, i) => n + (v === QUESTIONS[i].a ? 1 : 0), 0);
  }

  function render() {
    const app = document.getElementById("app");
    let html = "";

    if (state === "start") {
      html = `<div class="step">
        <h1><span class="hello">Kamu masih ingat kann...,</span><span class="name">Zahra?</span></h1>
        <p class="wish">${QUESTIONS.length} pertanyaan tentang kenangan kita. Pilih satu jawaban di setiap pertanyaan.</p>
        <div class="nav center"><button class="btn" data-act="start">Mulai</button></div>
      </div>`;
    } else if (state === "quiz") {
      const item = QUESTIONS[current];
      html = `<div class="step">
        <div class="progress"><span style="width:${(current / QUESTIONS.length) * 100}%"></span></div>
        <p class="count">Pertanyaan ${current + 1} dari ${QUESTIONS.length}</p>
        <h2 class="q">${item.q}</h2>
        <div class="opts">
          ${item.o.map((t, i) => `<button class="opt${answers[current] === i ? " picked" : ""}" data-act="pick" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${t}</span></button>`).join("")}
        </div>
        <div class="nav"><button class="ghost" data-act="back" ${current === 0 ? "disabled" : ""}>Sebelumnya</button></div>
      </div>`;
    } else if (state === "envelope") {
      html = `<div class="env-wrap">
        <button class="envelope${opened ? " open" : ""}" data-act="open" ${opened ? "disabled" : ""} aria-label="Buka amplop">
          <span class="env-body"></span>
          <span class="paper${opened ? " out" : ""}"><span class="msg">makasih yaa udah jadi seseorang yang paling aku sayangi dihidup ini, aku tetap sayang kamu😊</span></span>
          <span class="flap"></span>
          <span class="seal">♥</span>
          <span class="from">From: Farrell Zacky Pranata</span>
        </button>
        ${opened ? `<div class="nav center reveal"><button class="btn" data-act="result">Lihat hasil kuis</button></div>` : `<p class="tap">klik</p>`}
      </div>`;
    } else {
      const s = score();
      const message = TIERS.find(([min]) => s >= min)[1];
      const keyList = showKey
        ? `<ol class="key">${QUESTIONS.map((it, i) => {
            const ok = answers[i] === it.a;
            return `<li><strong>${i + 1}. ${it.q}</strong><br>${ok ? "✓" : "✗"} Jawaban kamu: ${it.o[answers[i]]}${ok ? "" : ` · Kunci: ${it.o[it.a]}`}</li>`;
          }).join("")}</ol>`
        : "";
      html = `<div class="step">
        <p class="count">Hasil kuismu</p>
        <div class="score">${s}<span> / ${QUESTIONS.length}</span></div>
        <p class="wish">${message}</p>
        <div class="nav center">
          <button class="btn" data-act="reveal">${showKey ? "Sembunyikan kunci jawaban" : "Lihat kunci jawaban"}</button>
          <button class="ghost" data-act="restart">Ulangi kuis</button>
        </div>
        ${keyList}
      </div>`;
    }

    app.innerHTML = html;
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === "start") {
      state = "quiz";
      current = 0;
      answers = [];
    } else if (act === "pick") {
      answers[current] = Number(btn.dataset.i);
      if (current < QUESTIONS.length - 1) {
        current++;
      } else {
        state = "envelope";
        opened = false;
      }
    } else if (act === "back") {
      if (current > 0) current--;
    } else if (act === "open") {
      opened = true;
    } else if (act === "result") {
      state = "result";
    } else if (act === "reveal") {
      showKey = !showKey;
    } else if (act === "restart") {
      state = "start";
      current = 0;
      answers = [];
      showKey = false;
      opened = false;
    }

    render();
  });

  render();
</script>
</body>
</html>
